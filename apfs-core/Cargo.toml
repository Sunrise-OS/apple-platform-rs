[package]
name = "apfs-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
readme = "README.md"
authors = ["Gregory Szorc <gregory.szorc@gmail.com>"]
description = "Apple File System (APFS) core data structures"
keywords = ["apple", "apfs", "filesystem"]
homepage = "https://github.com/indygreg/apple-platform-rs"
repository = "https://github.com/indygreg/apple-platform-rs.git"

[dependencies]
bitflags = "2.6.0"
bit-vec = { version = "0.8.0", default-features = false }
bytes = { version = "1.8.0", default-features = false }
embedded-io = "0.7.1"
log = "0.4.22"
num_enum = { version = "0.7.3", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
uuid = { version = "1.11.0", default-features = false }
xattr = { version = "1.3.1", optional = true }

[dependencies.apfs-types]
path = "../apfs-types"
version = "0.1.0"

[features]
default = ["std"]
# Host conveniences: std::io adapters, std::path/std::fs based APIs, xattrs,
# random UUID generation. Without it the crate is `no_std` + `alloc`.
std = [
  "apfs-types/std",
  "bit-vec/std",
  "bytes/std",
  "embedded-io/std",
  "thiserror/std",
  "uuid/std",
  "uuid/v4",
  "uuid/fast-rng",
  "dep:xattr",
]
